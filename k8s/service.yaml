apiVersion: v1
kind: Service
metadata:
  name: exam-study-planner
  labels:
    app: exam-study-planner
spec:
  type: NodePort
  selector:
    app: exam-study-planner
  ports:
    - name: http
      port: 80          # port inside the cluster
      targetPort: 5000  # port the app listens on in the container
      nodePort: 30080   # port opened on the Minikube node
