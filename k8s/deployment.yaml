apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-study-planner
  labels:
    app: exam-study-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-study-planner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: exam-study-planner
    spec:
      containers:
        - name: planner
          # Jenkins replaces this line with the image it just pushed (e.g. 1.0.0-build3)
          image: shehzaad23/exam-study-planner:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
